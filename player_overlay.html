<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>선수 오버레이</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Jua&family=Nanum+Gothic:wght@400;700;800&family=Noto+Sans+KR:wght@400;500;700;900&family=Bebas+Neue&family=Anton&family=Archivo+Black&family=Teko:wght@600;700&family=Gothic+A1:wght@700;800;900&family=Song+Myung&family=Nanum+Myeongjo:wght@700;800&family=Poor+Story&family=Gugi&family=Bagel+Fat+One&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    /* 방송 좌표계 고정: 내부는 항상 1920×1080으로 그리고, 화면 크기에 맞춰 통째로 축소/확대.
       → 브라우저 창 크기·디렉터원 렌더 크기와 상관없이 비율이 100% 동일 (어드민 미리보기와 같은 방식) */
    #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }

    /* ===== 프로 카드 테마 (사진 + 이름띠 일체형) ===== */
    .slot.pro {
      border-radius: 14px; overflow: hidden; background: #0b0f18;
      box-shadow: 0 0 0 2px var(--ring, #fff), 0 12px 28px rgba(0,0,0,0.55);
    }
    .slot.pro .avatar { border: 0 !important; border-radius: 0; box-shadow: none; }
    .slot.pro .posbadge {
      position: absolute; top: 8px; left: 8px; z-index: 3; margin: 0;
      border-radius: 6px; text-shadow: none; letter-spacing: 1px; line-height: 1.25;
      box-shadow: 0 2px 8px rgba(0,0,0,0.45);
    }
    .slot.pro .nameplate {
      margin: 0; width: 100%; border-radius: 0;
      display: flex; align-items: center; justify-content: center; overflow: hidden;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6); letter-spacing: 0.5px;
    }
    .slot.pro .nameplate span { white-space: nowrap; line-height: 1; }
    .slot.pro.swapping { box-shadow: 0 0 0 4px #16c60c, 0 12px 28px rgba(0,0,0,0.55); }
    .slot.pro .avatar.swapping { box-shadow: none; }

    /* 그룹 배경 패널 (팀 4명 뒤 반투명 판 + 팀색 상단 띠) */
    .gpanel {
      position: absolute; border-radius: 18px; pointer-events: none; overflow: hidden;
      box-shadow: 0 14px 36px rgba(0,0,0,0.45);
      opacity: 0; transition: opacity 0.5s ease;
    }
    .gpanel.on { opacity: 1; }
    .gpanel::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 5px; background: var(--accent, #fff); }
    .gtitle.pro.underline { box-shadow: none; }
    .gtitle.pro { border: none !important; border-radius: 10px; box-shadow: 0 8px 22px rgba(0,0,0,0.45); text-shadow: 0 2px 4px rgba(0,0,0,0.35); }
    .slot {
      position: absolute;
      display: flex; flex-direction: column; align-items: center;
      /* 등장: 팀명·VS와 동일한 페이드 + 살짝 떠오름.
         transition-delay는 JS에서 슬롯별로 줘서 안쪽(공격수)부터 차례로 등장시킨다. */
      opacity: 0;
      transform: translate(-50%, calc(-50% + 10px));
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }
    .slot.on { opacity: 1; transform: translate(-50%, -50%); }
    .slot .posbadge {
      margin-bottom: 6px; padding: 3px 12px; border-radius: 6px; font-weight: 800;
      white-space: nowrap; line-height: 1.1; text-shadow: 0 2px 5px rgba(0,0,0,0.7);
      letter-spacing: 0.5px;
    }
    .slot .avatar {
      width: 100%; aspect-ratio: 1/1; border-radius: 14px; overflow: hidden;
      background: #0d1017; box-shadow: 0 6px 22px rgba(0,0,0,0.55);
      border: 3px solid #fff;
    }
    /* 사진 2장을 겹쳐놓고 서로 페이드 = 교체 시 크로스페이드.
       평소엔 앞 레이어만 보이므로 동작에 영향 없음. */
    .slot .avatar { position: relative; }
    .slot .avatar img.ph {
      position: absolute; inset: 0;
      width: 100%; height: 100%; object-fit: cover; display: block;
      opacity: 0; transition: opacity 0.6s ease;
    }
    .slot .avatar img.ph.front { opacity: 1; }
    /* IN 배지 — 교체된 순간에만 잠깐 */
    .slot .avatar .swapbadge {
      position: absolute; top: 6px; left: 50%;
      transform: translate(-50%, -14px);
      background: #16c60c; color: #fff; z-index: 5;
      font-size: 13px; font-weight: 900; letter-spacing: 1px;
      padding: 2px 10px; border-radius: 20px;
      box-shadow: 0 2px 10px rgba(0,0,0,.5);
      opacity: 0; transition: opacity .35s ease, transform .35s cubic-bezier(0.16,1,0.3,1);
      pointer-events: none;
    }
    .slot .avatar .swapbadge.on { opacity: 1; transform: translate(-50%, 0); }
    /* 교체된 슬롯 강조 — 테두리가 잠깐 빛남 */
    .slot .avatar.swapping {
      box-shadow: 0 0 0 4px #16c60c, 0 6px 22px rgba(0,0,0,0.55);
      transition: box-shadow .35s ease;
    }
    .slot .avatar .empty { width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:#556; font-size:13px; }
    .slot .nameplate {
      margin-top: 8px; padding: 5px 14px; border-radius: 8px; font-weight: 800;
      white-space: nowrap; line-height: 1.15; text-shadow: 0 2px 6px rgba(0,0,0,0.75);
    }
    .gtitle {
      position: absolute;
      transform: translate(-50%, -100%);
      padding: 6px 22px; border-radius: 10px; font-weight: 800;
      white-space: nowrap; line-height: 1.15; text-shadow: 0 2px 6px rgba(0,0,0,0.75);
      display: flex; flex-direction: column; align-items: center;
      /* 등장: 0.5초 페이드 + 아래에서 살짝 떠오름 (순수 페이드보다 자연스럽고 고급스러움).
         cubic-bezier는 처음 빠르고 끝에서 부드럽게 감속 = 방송 그래픽 특유의 느낌 */
      opacity: 0;
      transform: translate(var(--tx, -50%), calc(-100% + 10px));
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }
    .gtitle.on { opacity: 1; transform: translate(var(--tx, -50%), -100%); }
    /* 밑줄 모드: 배경 없이 글자 아래 선만. 글자 세로 정렬이 어긋나지 않도록 padding으로 잡음 */
    .gtitle.underline { background: none !important; border: none !important; padding: 0; border-radius: 0; }
    .gtitle .gt-line { margin-top: 4px; width: 100%; border-radius: 2px; }

    /* 가운데 VS — 화면 정중앙 고정 */
    #vsMark {
      position: absolute; left: 50%; top: 50%;
      font-weight: 900; line-height: 1; white-space: nowrap;
      pointer-events: none;
      /* 팀명과 동일한 등장 방식 (페이드 + 살짝 떠오름) */
      opacity: 0;
      transform: translate(-50%, calc(-50% + 10px));
      transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }
    #vsMark.on { opacity: 1; transform: translate(-50%, -50%); }
    /* VS 위·아래 문구 — VS 다음에 등장 (위는 위에서 내려오고, 아래는 아래에서 올라옴) */
    .vcap { position: absolute; white-space: nowrap; pointer-events: none; line-height: 1.15;
      opacity: 0; transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); will-change: opacity, transform; }
    .vcap .cap-in, .vcap .cap-tx { display: inline-block; }
    #capTop { transform: translate(-50%, calc(-100% - 10px)); }
    #capTop.on { opacity: 1; transform: translate(-50%, -100%); }
    #capBot { transform: translate(-50%, 10px); }
    #capBot.on { opacity: 1; transform: translate(-50%, 0); }
    /* ===== [공용] 테마 CSS (player_overlay.html / player_admin.html 두 파일에 똑같이 들어있음) =====
       카드: .c-root(.slot/.pv-char) > .c-pos(포지션) .c-face(사진) .c-name(이름)
       팀명: .gtitle / .pv-title 에 tA / tB / tC */
    .c-pos span, .c-name span { white-space: nowrap; }
    .c-face img { transition: opacity 0.6s ease; }
    /* --- A: 중계 클린 --- */
    .thA { border-radius: 6px; overflow: hidden; box-shadow: 0 10px 28px rgba(0,0,0,.4); }
    .thA .c-face { border: 0 !important; border-radius: 0 !important; box-shadow: none !important; position: relative; }
    .thA .c-face::after { content: ''; position: absolute; inset: 0; z-index: 2; pointer-events: none;
      background: linear-gradient(to bottom, rgba(0,0,0,0) 45%, rgba(0,0,0,.82) 100%); }
    .thA::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: var(--bar, 6px); background: var(--tc); z-index: 4; }
    .thA .c-pos { position: absolute; z-index: 3; margin: 0 !important; padding: .2em .6em !important; background: #0c0f16 !important; border-radius: 2px;
      border-left: 4px solid var(--tc); color: #fff; font-weight: 800; letter-spacing: .08em; line-height: 1.2; text-shadow: none; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
    .thA .c-name { position: absolute; z-index: 3; margin: 0 !important; padding: 0 !important; background: none !important; border-radius: 0;
      color: #fff; font-weight: 800; letter-spacing: .02em; display: flex; align-items: flex-end; justify-content: flex-start; overflow: hidden;
      text-shadow: 0 2px 8px rgba(0,0,0,.5); }
    .thA .c-name span { line-height: 1.15; }
    /* --- B: 다크 글래스 --- */
    .thB { border-radius: 12px; overflow: hidden; background: rgba(12,14,20,.72); backdrop-filter: blur(10px);
      box-shadow: 0 0 0 1px rgba(255,255,255,.14), 0 14px 34px rgba(0,0,0,.45); }
    .thB .c-face { border: 0 !important; border-radius: 0 !important; box-shadow: none !important; }
    .thB .c-pos { position: absolute; z-index: 3; margin: 0 !important; padding: .2em .6em !important; background: rgba(12,14,20,.8) !important;
      border-radius: 6px; border: 1px solid rgba(255,255,255,.18); color: #fff; font-weight: 800; letter-spacing: .08em; line-height: 1.2;
      text-shadow: none; backdrop-filter: blur(6px); }
    .thB .c-name { position: relative; margin: 0 !important; width: 100%; background: none !important; border-radius: 0;
      display: flex; align-items: center; justify-content: center; overflow: hidden; color: #fff; font-weight: 800; letter-spacing: .03em; text-shadow: none; }
    .thB .c-name::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px;
      background: linear-gradient(90deg, transparent, var(--tc), transparent); }
    /* --- C: 스포츠 사선 --- */
    .thC { overflow: visible; filter: drop-shadow(0 10px 22px rgba(0,0,0,.45)); }
    .thC .c-face { border: 3px solid #fff !important; border-bottom: 0 !important; border-radius: 0 !important; box-shadow: none !important;
      transform: skewX(-8deg); transform-origin: 50% 100%; overflow: hidden; }
    .thC .c-face img { transform: skewX(8deg) scale(1.18); }
    .thC .c-pos { position: absolute; z-index: 3; margin: 0 !important; background: #0c0f16 !important; color: #fff; border-radius: 0;
      font-weight: 800; letter-spacing: .1em; padding: .25em .7em !important; line-height: 1.2; transform: skewX(-8deg); text-shadow: none; }
    .thC .c-pos span { display: inline-block; transform: skewX(8deg); }
    .thC .c-name { margin: 0 !important; width: 100%; border: 3px solid #fff; border-top: 0; border-radius: 0 !important;
      transform: skewX(-8deg); transform-origin: 50% 0; display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden; color: #fff; font-weight: 800; letter-spacing: .03em; text-shadow: none; }
    .thC .c-name::after { content: ''; position: absolute; right: -10%; top: 0; bottom: 0; width: 30%;
      background: repeating-linear-gradient(115deg, rgba(255,255,255,.18) 0 6px, transparent 6px 14px); }
    .thC .c-name span { display: inline-block; transform: skewX(8deg); position: relative; z-index: 1; line-height: 1.2; }
    /* --- 팀명 테마 (상자/밑줄 기본 모양을 끄고 새로 그림) --- */
    .tA, .tB, .tC { padding: 0 !important; background: none !important; border: none !important; border-radius: 0 !important; box-shadow: none !important; text-shadow: none !important; }
    .tA { flex-direction: row !important; align-items: stretch !important; filter: drop-shadow(0 8px 18px rgba(0,0,0,.35)); }
    .tA .t-edge { width: calc(var(--tf) * .28); background: #fff; transform: skewX(-14deg); margin-right: calc(var(--tf) * .18); }
    .tA .t-blk { background: var(--tc); transform: skewX(-14deg); padding: calc(var(--tf) * .2) calc(var(--tf) * .75); }
    .tA .t-blk span { display: block; transform: skewX(14deg); line-height: 1.2; letter-spacing: .04em; }
    .tB { align-items: stretch !important; }
    .tB .t-txt { display: block; text-align: center; line-height: 1.2; letter-spacing: .06em; padding-bottom: calc(var(--tf) * .18);
      text-shadow: 0 4px 16px rgba(0,0,0,.6) !important; }
    .tB .t-line { display: block; height: calc(var(--tf) * .1); width: 100%; background: var(--tc); border-radius: 2px; box-shadow: 0 0 18px var(--tc); }
    .tC { filter: drop-shadow(0 8px 18px rgba(0,0,0,.4)); }
    .tC .t-blk { background: #0c0f16; transform: skewX(-14deg); padding: calc(var(--tf) * .18) calc(var(--tf) * .8); border-bottom: calc(var(--tf) * .12) solid var(--tc); }
    .tC .t-blk span { display: block; transform: skewX(14deg); line-height: 1.2; letter-spacing: .05em; }
    /* --- 족구장 배경 --- */
    .court-bg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; pointer-events: none; display: none; }
    .court-bg.on { display: block; }
    /* ===== [공용] 끝 ===== */
  </style>
</head>
<body>
  <div id="stage">
    <img class="court-bg" id="courtBg" src="court_bg.jpg" alt="">
    <div class="gpanel" id="gpanelLeft"></div>
    <div class="gpanel" id="gpanelRight"></div>
    <div class="gtitle" id="gtitleLeft"></div>
    <div class="gtitle" id="gtitleRight"></div>
    <div id="vsMark"></div>
    <div class="vcap" id="capTop"></div>
    <div class="vcap" id="capBot"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script>
    // ===== 선수 오버레이 v7 (시안 A·B·C 테마 · 족구장 배경 · VS 위·아래 문구 · 1920×1080 고정 좌표계) =====
    // 코트 번호: URL 뒤에 ?court=2 붙이면 2코트. 기본 1.
    const courtNumber = new URLSearchParams(location.search).get('court') || '1';
    const courtPath = 'court' + courtNumber;

    const firebaseConfig = {
      apiKey: "AIzaSyAOIaiDKckDVDvDKe9qPURRWQqIsA7f1bs",
      authDomain: "scoreboard-3681d.firebaseapp.com",
      databaseURL: "https://scoreboard-3681d-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "scoreboard-3681d",
      storageBucket: "scoreboard-3681d.firebasestorage.app",
      messagingSenderId: "466288006612",
      appId: "1:466288006612:web:01d167367672c72a73b241"
    };
    firebase.initializeApp(firebaseConfig);
    // 어드민 저장 구조에 맞춤:
    //   shared            → roster(명단)/teams  (모든 코트 공용)
    //   court{N}/players  → slots/titles/layout (코트별)
    // 둘 다 구독해서 합쳐 렌더한다. (예전 구조: court{N}/players 안에 roster가 있던 것도 지원)
    const playersRef = firebase.database().ref(courtPath + '/players');
    const sharedRef  = firebase.database().ref('shared');

    const DEFAULT_STYLE = { x:50, y:70, size:150, font:22, family:"'Noto Sans KR',sans-serif", textColor:'#ffffff', plateColor:'#0a0c11', plateAlpha:62, borderColor:'#ffffff', theme:'classic' };

    /* ===== 방송 좌표계(1920×1080) 맞춤 =====
       스테이지를 화면에 맞게 비율 유지 축소/확대 + 가운데 정렬.
       브라우저 창이 16:9가 아니면 남는 부분은 투명 여백으로 둔다. */
    const BC_W = 1920, BC_H = 1080;
    function fitStage(){
      const st = document.getElementById('stage'); if(!st) return;
      const w = window.innerWidth || BC_W, h = window.innerHeight || BC_H;
      const s = Math.min(w / BC_W, h / BC_H);
      const ox = (w - BC_W * s) / 2, oy = (h - BC_H * s) / 2;
      st.style.transform = `translate(${ox}px, ${oy}px) scale(${s})`;
    }
    fitStage();
    window.addEventListener('resize', fitStage);

    /* ===== 공용 치수 계산 (player_admin.html 과 반드시 동일하게 유지) ===== */
    const SIDE_DEFAULT_COLOR = { left:'#c8102e', right:'#1e4fd8' };
    const PANEL_PAD = 16;   // 그룹 패널 안쪽 여백(px)
    function sideColor(side, titles){
      const t = (titles && titles[side]) || {};
      return t.bg || SIDE_DEFAULT_COLOR[side];
    }
    /* ===== [공용] 카드·팀명 테마 (player_overlay.html / player_admin.html 두 파일에 똑같이 들어있음) =====
       theme: 'A'(중계 클린) | 'B'(다크 글래스) | 'C'(스포츠 사선) | 'pro' | 'classic' */
    function proMetrics(st){
      const f = +st.font || 22;
      const padV = Math.round(f * 0.3);
      return { plateH: Math.round(f * 1.2) + padV * 2, padH: Math.round(f * 0.35), badgeFont: Math.max(11, Math.round(f * 0.6)) };
    }
    // 테마별 카드 치수(px). s=사진 크기, f=이름 글자크기
    function cardMetrics(st){
      const s = +st.size || 150, f = +st.font || 22, th = st.theme;
      if (th === 'A') {
        const pf = Math.max(15, Math.round(f * 0.56)), bar = Math.max(4, Math.round(s * 0.028));
        return { pf, bar, px: Math.round(s * 0.07), nameBottom: Math.round(s * 0.07) + bar, nameH: Math.round(f * 1.15), plateH: 0 };
      }
      if (th === 'B') {
        // 포지션은 사진 왼쪽 위로 옮김 → 아래 판에는 이름만
        const pf = Math.max(15, Math.round(f * 0.56));
        const padT = Math.round(s * 0.05), nameH = Math.round(f * 1.2), padB = Math.round(s * 0.06);
        return { pf, padT, nameH, padB, plateH: padT + nameH + padB };
      }
      if (th === 'C') {
        const pf = Math.max(14, Math.round(f * 0.56)), padV = Math.round(s * 0.035), nameH = Math.round(f * 1.2);
        return { pf, padV, nameH, plateH: 3 + padV * 2 + nameH };
      }
      if (th === 'pro') return { plateH: proMetrics(st).plateH };
      return null;
    }
    // 카드 한 장의 전체 크기(px). 슬롯은 이 박스의 중심이 (x%, y%)에 놓인다.
    function slotBoxPx(st){
      const f = +st.font || 22, size = +st.size || 150;
      const m = cardMetrics(st);
      if (m) return { w: size, h: size + m.plateH };
      const badgeH = f * 0.72 * 1.1 + 6, plateH = f * 1.15 + 10;
      return { w: size, h: badgeH + 6 + size + 8 + plateH };
    }
    function groupRectPx(items){
      let l = Infinity, r = -Infinity, t = Infinity, b = -Infinity;
      items.forEach(it => {
        const bx = slotBoxPx(it.st), cx = it.x / 100 * 1920, cy = it.y / 100 * 1080;
        l = Math.min(l, cx - bx.w / 2); r = Math.max(r, cx + bx.w / 2);
        t = Math.min(t, cy - bx.h / 2); b = Math.max(b, cy + bx.h / 2);
      });
      return { l, r, t, b };
    }
    // 이름이 칸보다 길면 글자를 줄여서 한 줄에 맞춤 (최소 55%)
    function fitPlate(plate, base){
      const span = plate.querySelector('span'); if (!span) return;
      span.style.fontSize = base + 'px';
      const cs = getComputedStyle(plate);
      const avail = plate.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      const w = span.offsetWidth;
      if (avail > 0 && w > avail) span.style.fontSize = Math.max(base * 0.55, Math.floor(base * avail / w * 10) / 10) + 'px';
    }
    function rgbaOf(hex, alpha){
      const h = (hex || '#000000').replace('#', '');
      return `rgba(${parseInt(h.substring(0,2),16)},${parseInt(h.substring(2,4),16)},${parseInt(h.substring(4,6),16)},${(alpha == null ? 100 : alpha) / 100})`;
    }
    // 카드 꾸미기: root/badge/face/plate 요소에 테마 클래스와 치수를 입힌다
    function styleCard(root, badge, face, plate, st, accent, posName, name){
      const th = st.theme || 'classic', s = +st.size || 150, f = +st.font || 22;
      ['pro','thA','thB','thC'].forEach(c => root.classList.remove(c));
      if (['A','B','C'].includes(th)) root.classList.add('th' + th); else if (th === 'pro') root.classList.add('pro');
      root.style.setProperty('--tc', accent);
      root.style.setProperty('--ring', st.borderColor);
      badge.style.cssText = ''; plate.style.cssText = '';
      badge.innerHTML = ''; const bs = document.createElement('span'); bs.textContent = posName; badge.appendChild(bs);
      plate.innerHTML = ''; const ns = document.createElement('span'); ns.textContent = name; plate.appendChild(ns);
      face.style.borderColor = st.borderColor;
      badge.style.fontFamily = st.family; plate.style.fontFamily = st.family;
      plate.style.color = st.textColor;
      const m = cardMetrics(st);
      if (th === 'A') {
        badge.style.fontSize = m.pf + 'px';
        badge.style.top = Math.round(s * 0.05) + 'px';
        badge.style.left = Math.round(s * 0.05) + 'px';
        plate.style.fontSize = f + 'px';
        plate.style.left = m.px + 'px';
        plate.style.right = Math.round(s * 0.05) + 'px';
        plate.style.bottom = m.nameBottom + 'px';
        plate.style.height = m.nameH + 'px';
        root.style.setProperty('--bar', m.bar + 'px');
      } else if (th === 'B') {
        badge.style.fontSize = m.pf + 'px';
        badge.style.top = Math.round(s * 0.05) + 'px';
        badge.style.left = Math.round(s * 0.05) + 'px';
        plate.style.fontSize = f + 'px';
        plate.style.height = m.plateH + 'px';
        plate.style.padding = `0 ${Math.round(s * 0.06)}px`;
        ns.style.lineHeight = (m.nameH / f).toFixed(3);
      } else if (th === 'C') {
        badge.style.fontSize = m.pf + 'px';
        badge.style.top = Math.round(s * 0.06) + 'px';
        badge.style.left = Math.round(s * 0.02) + 'px';
        plate.style.fontSize = f + 'px';
        plate.style.height = m.plateH + 'px';
        plate.style.background = accent;
      } else if (th === 'pro') {
        const pm = proMetrics(st);
        badge.style.fontSize = pm.badgeFont + 'px';
        badge.style.color = '#ffffff';
        badge.style.background = accent;
        badge.style.padding = Math.round(pm.badgeFont * 0.25) + 'px ' + Math.round(pm.badgeFont * 0.6) + 'px';
        plate.style.height = pm.plateH + 'px';
        plate.style.padding = '0 ' + pm.padH + 'px';
        plate.style.fontSize = f + 'px';
        plate.style.background = rgbaOf(st.plateColor, st.plateAlpha);
        plate.style.boxShadow = 'inset 0 4px 0 ' + accent;
      } else {
        // 클래식 (기존 그대로)
        badge.style.fontSize = Math.round(f * 0.72) + 'px';
        badge.style.color = st.textColor;
        badge.style.background = rgbaOf(st.plateColor, st.plateAlpha);
        plate.style.fontSize = f + 'px';
        plate.style.background = rgbaOf(st.plateColor, st.plateAlpha);
        return;   // 클래식은 이름 자동 축소 안 함 (기존 동작 유지)
      }
      fitPlate(plate, f);
    }
    // 팀명 꾸미기 (A/B/C 테마). 처리했으면 true
    function styleTitleTheme(el, th, text, side, tf, titles){
      el.classList.remove('tA','tB','tC','underline');
      if (!['A','B','C'].includes(th)) return false;
      el.classList.add('t' + th);
      const tc = sideColor(side, titles);
      el.style.setProperty('--tf', tf + 'px');
      el.style.setProperty('--tc', tc);
      el.style.background = 'none'; el.style.border = 'none';
      el.innerHTML = '';
      const sp = document.createElement('span'); sp.textContent = text;
      if (th === 'A') {
        const edge = document.createElement('div'); edge.className = 't-edge';
        const blk = document.createElement('div'); blk.className = 't-blk'; blk.appendChild(sp);
        el.appendChild(edge); el.appendChild(blk);
      } else if (th === 'B') {
        sp.className = 't-txt'; el.appendChild(sp);
        const ln = document.createElement('i'); ln.className = 't-line'; el.appendChild(ln);
      } else {
        const blk = document.createElement('div'); blk.className = 't-blk'; blk.appendChild(sp); el.appendChild(blk);
      }
      return true;
    }
    /* ===== [공용] 끝 ===== */

    /* ===== [공용] VS 위·아래 문구 (player_overlay.html / player_admin.html 두 파일에 똑같이 들어있음) =====
       VS가 켜진 경기 소개 화면에서만 나온다. 문구를 비우면 자동으로 숨김.
       위치: 화면 정중앙(VS) 기준 위/아래로 gap(px)만큼 띄움. 좌표는 1920×1080 고정. */
    const CAP_DEFAULT = {
      top:    { text:'', size:72, family:"'Black Han Sans',sans-serif", weight:400, italic:true,  color:'#ffd54a',
                outline:3, outlineColor:'#000000', ribbon:false, ribbonColor:'#0b0f18', ribbonAlpha:85, gap:6 },
      bottom: { text:'', size:40, family:"'Nanum Gothic',sans-serif",   weight:800, italic:false, color:'#ffffff',
                outline:0, outlineColor:'#000000', ribbon:true,  ribbonColor:'#0b0f18', ribbonAlpha:85, gap:14 }
    };
    function capCfg(cap, pos){ return { ...CAP_DEFAULT[pos], ...((cap && cap[pos]) || {}) }; }
    // el 에 문구를 그린다. 보여야 하면 true
    function styleCap(el, cap, pos, vs){
      const c = capCfg(cap, pos);
      const text = String(c.text || '').trim();
      if (!vs || !vs.show || !text) return false;
      const vsSize = (vs.size != null ? +vs.size : 90);
      const gap = +c.gap || 0;
      el.style.left = '50%';
      el.style.top = (pos === 'top' ? (540 - vsSize / 2 - gap) : (540 + vsSize / 2 + gap)) + 'px';
      el.innerHTML = '';
      const inn = document.createElement('span'); inn.className = 'cap-in';
      const tx = document.createElement('span'); tx.className = 'cap-tx'; tx.textContent = text;
      inn.appendChild(tx); el.appendChild(inn);
      el.style.fontSize = (+c.size || 40) + 'px';
      el.style.fontFamily = c.family;
      el.style.fontWeight = c.weight;
      el.style.color = c.color;
      const ow = +c.outline || 0;
      tx.style.webkitTextStroke = ow > 0 ? (ow + 'px ' + c.outlineColor) : '';
      // 한글 폰트는 이탤릭이 거의 없으므로 기울임은 skew로 처리 (VS와 같은 방향)
      inn.style.transform = c.italic ? 'skewX(-10deg)' : '';
      if (c.ribbon) {
        inn.style.background = rgbaOf(c.ribbonColor, c.ribbonAlpha);
        inn.style.padding = '.2em .8em';
        inn.style.boxShadow = '0 8px 22px rgba(0,0,0,.45)';
        tx.style.textShadow = 'none';
      } else {
        inn.style.background = 'none'; inn.style.padding = '0'; inn.style.boxShadow = 'none';
        tx.style.textShadow = '0 4px 14px rgba(0,0,0,.6)';
      }
      return true;
    }
    /* ===== [공용] VS 위·아래 문구 끝 ===== */
    // 포지션(슬롯 고정): 좌0~3, 우4~7
    const POS_NAME = ['우수비','좌수비','세터','공격수', '공격수','세터','좌수비','우수비'];
    const stage = document.getElementById('stage');
    const titleEls = { left: document.getElementById('gtitleLeft'), right: document.getElementById('gtitleRight') };
    const vsEl = document.getElementById('vsMark');
    let els = []; // 8개 슬롯 DOM 캐시

    // 슬롯 DOM 8개를 미리 생성 (재생성 안 하고 갱신만 → 깜빡임 없음)
    for (let i = 0; i < 8; i++) {
      const el = document.createElement('div');
      el.className = 'slot';
      el.className = 'slot c-root';
      el.innerHTML = `<div class="posbadge c-pos"></div><div class="avatar c-face"><img class="ph ph-a" alt=""><img class="ph ph-b" alt=""><div class="empty" style="display:none"></div><div class="swapbadge">IN</div></div><div class="nameplate c-name"></div>`;
      stage.appendChild(el);
      els.push({
        root: el,
        badge: el.querySelector('.posbadge'),
        avatar: el.querySelector('.avatar'),
        imgA: el.querySelector('.ph-a'),
        imgB: el.querySelector('.ph-b'),
        swapBadge: el.querySelector('.swapbadge'),
        empty: el.querySelector('.empty'),
        plate: el.querySelector('.nameplate'),
        lastPhoto: null,
        lastPlayerId: null,   // 선수가 바뀌었는지 감지용
        frontIsA: true,       // 지금 앞에 보이는 레이어
        swapTimer: null
      });
    }

    function hexToRgba(hex, alpha){
      const h = (hex||'#000000').replace('#','');
      const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
      return `rgba(${r},${g},${b},${(alpha==null?100:alpha)/100})`;
    }

    // 사진 캐시 우회: 같은 선수·같은 사진이면 항상 같은 URL(불필요 재로딩 없음),
    // 선수나 사진이 바뀌면 URL이 달라져 브라우저가 옛 이미지를 재사용하지 못하게 한다.
    function bust(url, pid){
      if(!url) return url;
      const key = encodeURIComponent(String(pid||''));
      return url + (url.indexOf('?')>=0 ? '&' : '?') + 'pid=' + key;
    }

    // 두 경로의 최신 값을 보관했다가 합쳐서 렌더
    let courtData = {}, sharedData = {};
    let gotCourt = false, gotShared = false;

    // DB 규칙이 auth != null 이므로, 익명 로그인 완료 후에만 리스너를 등록한다.
    // (로그인 전에 .on 을 걸면 permission_denied 발생)
    let listenersAttached = false;
    function attachListeners(){
      if (listenersAttached) return;
      listenersAttached = true;
      playersRef.on('value', snap => { courtData = snap.val() || {}; gotCourt = true; render(); });
      sharedRef.on('value',  snap => { sharedData = snap.val() || {}; gotShared = true; render(); });
    }
    firebase.auth().onAuthStateChanged(user => {
      if (user) attachListeners();
    });
    firebase.auth().signInAnonymously().catch(err => {
      console.error('익명 로그인 실패:', err);
    });
    // 웹폰트가 늦게 로드되면 글자 폭이 바뀌므로 이름 자동 축소를 다시 계산
    if (document.fonts) {
      document.fonts.ready.then(() => render());
      if (document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', () => render());
    }

    function render(){
      // 둘 다 도착하기 전엔 그리지 않음 (사진 없는 빈 칸이 깜빡이는 것 방지)
      if (!gotCourt || !gotShared) return;
      const data = courtData;
      // 명단은 shared 우선, 없으면 예전 구조(court 안의 roster) 사용
      const roster = (sharedData.roster && Object.keys(sharedData.roster).length)
                     ? sharedData.roster
                     : (data.roster || {});
      const slots = (data.slots && data.slots.length === 8) ? data.slots : [];
      const titlesAll = data.titles || {};

      for (let i = 0; i < 8; i++) {
        const e = els[i];
        const s = slots[i];
        if (!s || !s.visible || !s.playerId) {
          e.root.style.transitionDelay = '0ms';
          e.root.classList.remove('on');
          // 숨겨진 슬롯은 교체 추적 초기화 → 다시 켤 때 교체로 오인하지 않음
          e.lastPlayerId = null;
          clearTimeout(e.swapTimer);
          e.swapBadge.classList.remove('on');
          e.avatar.classList.remove('swapping'); e.root.classList.remove('swapping');
          continue;
        }

        const p = roster[s.playerId];
        const st = { ...DEFAULT_STYLE, ...(s.style || {}) };

        // 위치/크기
        e.root.style.left = st.x + '%';
        e.root.style.top = st.y + '%';
        e.root.style.width = st.size + 'px';
        e.avatar.style.borderColor = st.borderColor;

        // ===== 사진 + 선수 교체 감지 =====
        // 같은 슬롯인데 playerId가 바뀌면 = 교체. 사진을 뒤 레이어에 넣고 크로스페이드.
        // 첫 등장(lastPlayerId===null)은 교체가 아니므로 조용히 표시만 한다.
        const photo = p && p.photo ? p.photo : '';
        const isSwap = (e.lastPlayerId !== null && e.lastPlayerId !== s.playerId);

        // 사진 URL이 바뀌었거나, 선수가 교체되었으면 사진 레이어를 갱신한다.
        // (URL이 우연히 같아도 선수가 바뀌면 반드시 다시 그림 → 이름만 바뀌고 얼굴이 안 바뀌는 버그 방지)
        if (photo !== e.lastPhoto || isSwap) {
          e.lastPhoto = photo;
          const front = e.frontIsA ? e.imgA : e.imgB;
          const back  = e.frontIsA ? e.imgB : e.imgA;

          if (!photo) {
            // 사진 없음 → 이름만
            e.imgA.classList.remove('front'); e.imgB.classList.remove('front');
            e.empty.style.display = 'flex'; e.empty.textContent = p ? p.name : '';
          } else if (isSwap) {
            // 교체: 새 사진을 뒤 레이어에 로드 → 로드 완료 후 앞뒤 전환 (부드럽게 교차)
            e.empty.style.display = 'none';
            back.onload = () => {
              back.classList.add('front');
              front.classList.remove('front');
              e.frontIsA = !e.frontIsA;
            };
            back.src = bust(photo, s.playerId);
            if (back.complete && back.naturalWidth) back.onload();   // 캐시된 이미지 대응

            // IN 배지 + 슬롯 강조 (2.5초 후 자동으로 사라짐)
            clearTimeout(e.swapTimer);
            e.swapBadge.classList.add('on');
            e.avatar.classList.add('swapping'); e.root.classList.add('swapping');
            e.swapTimer = setTimeout(() => {
              e.swapBadge.classList.remove('on');
              e.avatar.classList.remove('swapping'); e.root.classList.remove('swapping');
            }, 2500);
          } else {
            // 첫 등장·사진만 교체: 애니메이션 없이 앞 레이어에 바로
            e.empty.style.display = 'none';
            front.src = bust(photo, s.playerId);
            front.classList.add('front');
          }
        }
        e.lastPlayerId = s.playerId;

        // 카드 테마 적용 (공용 styleCard — 어드민 미리보기와 동일)
        const accent = sideColor(i < 4 ? 'left' : 'right', titlesAll);
        styleCard(e.root, e.badge, e.avatar, e.plate, st, accent, POS_NAME[i], p ? (p.name || '') : '');

        // 순차 등장: 이 슬롯이 "새로 나타나는" 순간에만 딜레이를 주고,
        // 이미 떠 있는 상태에서의 조절(슬라이더 등)에는 딜레이 0 → 반응이 즉각적.
        const wasOn = e.root.classList.contains('on');
        if (!wasOn) {
          const distFromCenter = (i < 4) ? (3 - i) : (i - 4);  // 3,4→0 / 2,5→1 / 1,6→2 / 0,7→3
          e.root.style.transitionDelay = (distFromCenter * 80) + 'ms';
        } else {
          e.root.style.transitionDelay = '0ms';
        }
        e.root.classList.add('on');
      }

      // ===== 그룹 팀명 (각 그룹 상단 중앙) =====
      const titles = data.titles || {};
      const commonStyle = { ...DEFAULT_STYLE, ...((slots[0] && slots[0].style) || {}) };
      const teams = sharedData.teams || data.teams || {};
      renderTitle('left',  [0,1,2,3], slots, roster, titles.left,  commonStyle, titles.autoMode, teams, titles);
      renderTitle('right', [4,5,6,7], slots, roster, titles.right, commonStyle, titles.autoMode, teams, titles);
      // 족구장 배경: VS가 있는 화면(경기 소개)에서만. 경기 중(VS 없음) 화면은 항상 투명.
      document.getElementById('courtBg').classList.toggle('on', !!(data.bg && data.bg.show && data.vs && data.vs.show));
      renderPanel('left',  [0,1,2,3], slots, roster, titles);
      renderPanel('right', [4,5,6,7], slots, roster, titles);
      renderVS(data.vs, commonStyle);
      renderCaps(data.cap, data.vs);
    }

    // 그룹에 실제로 들어간 선수들의 소속 팀 중 가장 많은 팀 이름 (선수 개별 배정·일부만 배정해도 팀명이 잡히도록)
    function teamFromSlots(idxs, slots, roster, teams){
      const cnt = {};
      idxs.forEach(i => { const s = slots[i];
        if (s && s.visible && s.playerId && roster[s.playerId]) {
          const tid = roster[s.playerId].teamId;
          if (tid && teams[tid]) cnt[tid] = (cnt[tid] || 0) + 1;
        } });
      let best = null, bn = 0;
      Object.keys(cnt).forEach(t => { if (cnt[t] > bn) { bn = cnt[t]; best = t; } });
      return best ? (teams[best].name || '').trim() : '';
    }

    // ===== 그룹 배경 패널 (팀 4명 뒤) =====
    const panelEls = { left: document.getElementById('gpanelLeft'), right: document.getElementById('gpanelRight') };
    function renderPanel(side, idxs, slots, roster, titles){
      const el = panelEls[side];
      const pc = (titles && titles.panel) || {};
      const shown = idxs.filter(i => { const s = slots[i]; return s && s.visible && s.playerId && roster[s.playerId]; });
      if (!pc.show || shown.length === 0) { el.classList.remove('on'); return; }
      const r = groupRectPx(shown.map(i => { const st = { ...DEFAULT_STYLE, ...(slots[i].style || {}) }; return { x: st.x, y: st.y, st }; }));
      el.style.left = (r.l - PANEL_PAD) + 'px';
      el.style.top = (r.t - PANEL_PAD) + 'px';
      el.style.width = (r.r - r.l + PANEL_PAD * 2) + 'px';
      el.style.height = (r.b - r.t + PANEL_PAD * 2) + 'px';
      el.style.background = 'rgba(10,13,20,' + ((pc.alpha != null ? pc.alpha : 55) / 100) + ')';
      el.style.setProperty('--accent', pc.accent === false ? 'transparent' : sideColor(side, titles));
      el.classList.add('on');
    }

    function renderTitle(side, idxs, slots, roster, cfg, st, autoMode, teams, titlesAll){
      const el = titleEls[side];
      cfg = cfg || {};
      // 팀명 우선순위: ① 수동 입력이 항상 최우선
      //               ② 자동 모드: 'player'=공격수 이름+"팀"(동네운동) / 'team'=배정한 팀 이름(시합)
      // 공격수 슬롯: 좌측=3, 우측=4 (둘 다 중앙에서 마주봄)
      const autoM = autoMode || 'player';
      const atkIdx = (side === 'left') ? 3 : 4;
      const atk = slots[atkIdx];
      const atkName = (atk && atk.visible && atk.playerId && roster[atk.playerId])
                      ? (roster[atk.playerId].name || '').trim() : '';
      const autoFromAtk = atkName ? (atkName + '팀') : '';
      const autoFromTeam = teamFromSlots(idxs, slots, roster, teams || {}) || (cfg.auto || '').trim();
      const autoText = (autoM === 'team') ? (autoFromTeam || autoFromAtk) : (autoFromAtk || autoFromTeam);
      const text = (cfg.text && cfg.text.trim()) || autoText;
      // 이 그룹에서 실제로 보이는 슬롯만 대상
      const shown = idxs.filter(i => {
        const s = slots[i];
        return s && s.visible && s.playerId && roster[s.playerId];
      });
      if (!cfg.show || !text || shown.length === 0) { el.style.transitionDelay='0ms'; el.classList.remove('on'); return; }

      // 그룹 가로 중앙 = 보이는 슬롯 x의 (min+max)/2, 상단 = 최소 y에서 사진 절반만큼 위
      let minX = 100, maxX = 0, minY = 100, sizeAtTop = st.size;
      shown.forEach(i => {
        const s = { ...DEFAULT_STYLE, ...(slots[i].style || {}) };
        if (s.x < minX) minX = s.x;
        if (s.x > maxX) maxX = s.x;
        if (s.y < minY) { minY = s.y; sizeAtTop = s.size; }
      });
      const cx = (minX + maxX) / 2;
      // 사진 위쪽 경계 = y% - (사진높이 절반). 사진높이는 px이므로 화면높이 비율로 변환.
      const stageH = stage.clientHeight || (window.innerHeight || 1080);
      const halfPhotoPct = ((sizeAtTop / 2) / stageH) * 100;
      // 포지션 배지(우수비 등)가 사진 위에 있으므로 그 높이만큼은 항상 비켜줌
      const badgeH = st.font * 0.72;           // 배지 글자크기
      const badgePad = 6 + 6;                   // 배지 상하 패딩+아래 여백(대략)
      const badgeBlockPct = ((badgeH + badgePad) / stageH) * 100;
      // 사용자 조절 간격 (기본 12px) — 배지 위에서 팀명까지 추가 거리
      const userGapPx = (cfg.gap != null ? cfg.gap : 12);
      const userGapPct = (userGapPx / stageH) * 100;
      let topY = minY - halfPhotoPct - badgeBlockPct - userGapPct;
      let cxF = cx;
      const th = st.theme || 'classic';
      const isPro = (th !== 'classic');
      let tx = '-50%';
      if (isPro) {
        // 프로/A/B/C 테마: 카드 실제 외곽 기준으로 정확히 계산. 패널이 켜져 있으면 패널 위로.
        const r = groupRectPx(shown.map(i => { const s = { ...DEFAULT_STYLE, ...(slots[i].style || {}) }; return { x: s.x, y: s.y, st: s }; }));
        const panelOn = !!(titlesAll && titlesAll.panel && titlesAll.panel.show);
        const pad = panelOn ? PANEL_PAD : 0;
        topY = (r.t - pad - userGapPx) / BC_H * 100;
        cxF = ((r.l + r.r) / 2) / BC_W * 100;
        // 정렬: 'outer' = 팀 바깥쪽 끝에 맞춤 (좌팀은 왼쪽 끝, 우팀은 오른쪽 끝)
        if (cfg.align === 'outer') {
          if (side === 'left') { cxF = (r.l - pad) / BC_W * 100; tx = '0%'; }
          else { cxF = (r.r + pad) / BC_W * 100; tx = '-100%'; }
        }
      }
      el.style.setProperty('--tx', tx);

      // 팀명 전용 스타일 (없으면 공통 스타일 fallback) — 어드민 미리보기와 동일 규칙
      const tFont     = (cfg.font != null ? cfg.font : Math.round(st.font * 1.25));
      const tFamily   = (cfg.family || st.family);
      const tColor    = (cfg.color || st.textColor);
      const titleBg   = (cfg.bg || (isPro ? SIDE_DEFAULT_COLOR[side] : st.plateColor));
      const titleAlpha= (cfg.bgAlpha != null ? cfg.bgAlpha : (isPro ? 100 : st.plateAlpha));
      const tBorder   = (cfg.border || st.borderColor);
      const tWeight   = (cfg.weight != null ? cfg.weight : 800);
      const tItalic   = !!cfg.italic;
      const mode      = (cfg.mode || 'box');            // 'box' | 'underline'
      const lineW     = (cfg.lineW != null ? cfg.lineW : 4);

      // A/B/C 테마는 전용 팀명 모양 (공용 styleTitleTheme)
      const themed = styleTitleTheme(el, th, text, side, tFont, titlesAll);
      if (!themed) {
      // 글자 요소 + (밑줄 모드면) 선 요소
      el.innerHTML = '';
      const span = document.createElement('span');
      span.textContent = text;
      // line-height를 넉넉히 줘서 한글 받침이 잘리거나 위로 쏠리지 않게 (세로 중앙 정렬 문제 해결)
      span.style.lineHeight = '1.3';
      span.style.display = 'block';
      el.appendChild(span);
      }

      el.classList.toggle('pro', th === 'pro');
      el.style.left = cxF + '%';
      el.style.top = topY + '%';
      el.style.fontSize = tFont + 'px';
      el.style.color = tColor;
      el.style.fontFamily = tFamily;
      el.style.fontWeight = tWeight;
      el.style.fontStyle = tItalic ? 'italic' : 'normal';

      if (themed) {
        // 모양은 styleTitleTheme 이 처리
      } else if (mode === 'underline') {
        el.classList.add('underline');
        const line = document.createElement('div');
        line.className = 'gt-line';
        line.style.height = lineW + 'px';
        line.style.background = tColor;      // 밑줄은 글자색과 동일
        el.appendChild(line);
      } else {
        el.classList.remove('underline');
        el.style.background = hexToRgba(titleBg, titleAlpha);
        el.style.border = '2px solid ' + tBorder;
      }
      // 팀명은 선수들이 다 등장한 뒤(약 0.34초)에 나타나야 자연스러움. 이미 떠 있으면 딜레이 없음.
      el.style.transitionDelay = el.classList.contains('on') ? '0ms' : '340ms';
      el.classList.add('on');
    }

    // ===== VS 위·아래 문구 =====
    const capEls = { top: document.getElementById('capTop'), bottom: document.getElementById('capBot') };
    function renderCaps(cap, vs){
      ['top','bottom'].forEach(pos => {
        const el = capEls[pos];
        const wasOn = el.classList.contains('on');
        if (!styleCap(el, cap, pos, vs)) { el.style.transitionDelay = '0ms'; el.classList.remove('on'); return; }
        // VS(520ms) 다음 순서: 위 문구 → 아래 문구
        el.style.transitionDelay = wasOn ? '0ms' : (pos === 'top' ? '720ms' : '860ms');
        el.classList.add('on');
      });
    }

    // ===== 가운데 VS =====
    function renderVS(vs, st){
      const el = vsEl;
      vs = vs || {};
      if (!vs.show) { el.style.transitionDelay='0ms'; el.classList.remove('on'); return; }
      el.textContent = (vs.text || 'VS');
      el.style.fontSize = (vs.size != null ? vs.size : 90) + 'px';
      el.style.color = (vs.color || '#ffffff');
      el.style.fontFamily = (vs.family || st.family);
      el.style.fontWeight = (vs.weight != null ? vs.weight : 900);
      el.style.fontStyle = vs.italic ? 'italic' : 'normal';
      // 테두리(외곽선) — 심플하게 글자 주변 스트로크
      const ow = (vs.outline != null ? vs.outline : 3);
      const oc = (vs.outlineColor || '#000000');
      el.style.webkitTextStroke = ow > 0 ? (ow + 'px ' + oc) : '';
      el.style.textShadow = '0 4px 14px rgba(0,0,0,0.6)';
      // VS는 팀명보다 조금 더 뒤에 = 마지막에 등장 (선수 → 팀명 → VS 순서로 완성)
      el.style.transitionDelay = el.classList.contains('on') ? '0ms' : '520ms';
      el.classList.add('on');
    }
  </script>
</body>
</html>
